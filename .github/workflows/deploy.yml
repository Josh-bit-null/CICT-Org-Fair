name: Deploy to GitHub Pages

on:
  push:
    branches:
      [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/configure-pages@v5
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Build web release
        run: >-
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=CMS=${{ vars.CMS }}
          --dart-define=CMS_URL=${{ vars.CMS_URL }}
          --dart-define=CMS_SPACE=${{ vars.CMS_SPACE }}
          --dart-define=CMS_PROJECT=${{ vars.CMS_PROJECT }}
          --dart-define=CMS_DATASET=${{ vars.CMS_DATASET }}
          --dart-define=CMS_TOKEN=${{ secrets.CMS_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
